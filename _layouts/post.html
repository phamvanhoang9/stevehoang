---
layout: default
---
<section class="post">
	<header class="major">
		{% include post-date.html date=page.date %}
		<h1>{{ page.title }}</h1>
		{% if page.description %}<p>{{ page.description }}</p>{% endif %}
	</header>
	{% if page.image %}
	<div class="image main"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}" /></div>
	{% endif %}
	{{ content }}
	{% include tags.html tags=page.tags %}
	<ul class="actions special">
		<li><a href="{{ '/blog/' | relative_url }}" class="button">All posts</a></li>
	</ul>
</section>
